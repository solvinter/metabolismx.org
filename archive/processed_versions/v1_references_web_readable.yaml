  - id: "lieberman2011the-evolution-of-hum"
    title: "The Evolution of Human Physical Activity"
    authors: "Daniel E. Lieberman"
    year: 2011
    journal: ""
    doi: "1086/659952"
    url: "https://doi.org/10.1086/659952"
    site_section: "vetenskap"
    site_subpage: "vetenskap/ovriga-kallor"
    category: ["Antropologi", "Evolutionär medicin", "fysisk aktivitet", "metabolism"]
    tags: ["Evolution", "Evolutionary biology", "Human physiology", "Hunter-gatherers", "metabolism", "physical activity"]
    summary: >
      Lieberman argumenterar för att både människans anatomi och metabolism är formade av en evolutionär miljö där uthållighetsrörelse, födosökande och varierad fysisk aktivitet var centrala. Han visar att brist på rörelse skapar en mismatch mellan modern livsstil och biologiska behov, vilket leder till metabola och neurobiologiska sjukdomar.
    insights_for_site: >
      • Människan är evolutionärt programmerad för rörelse i varierade former, inte stillasittande.
      • Fysisk aktivitet är inte optimering — det är ett biologiskt grundkrav för hjärnans och metabolismens funktion.
      • Rörelse och metabolism utvecklades tillsammans och bildar ett gemensamt system som inte går att separera.
      • Många moderna sjukdomar (depression, ångest, insulinresistens, artros, kardiometabola sjukdomar) är uttryck för evolutionär mismatch.
      • Hjärnan är ett metabolt organ som är beroende av rörelse för neuroplasticitet och emotionell reglering.
      • Rörelse är därför inte en intervention — det är att återgå till biologisk baslinje.
      • Fysisk aktivitet är kärnan i longevity-rörelsens mest evidensbaserade dimension: inte att förlänga livet, utan att fördjupa den friska delen av livet (healthspan).
      • Den ursprungliga människan levde inte nödvändigtvis längre än vi gör — men hon mådde sannolikt betydligt bättre under de år hon faktiskt levde, eftersom hennes livsstil låg i linje med vår biologi.
