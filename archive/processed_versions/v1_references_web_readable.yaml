    title: "The Framingham Study: Epidemiological Approaches to Heart Disease"
    authors: "Dawber TR, Meadors GF, Moore FE"
    year: 1951
    journal: "American Journal of Public Health"
    doi: "10.2105/ajph.41.3.279"
    url: "https://doi.org/10.2105/AJPH.41.3.279"
    site_section: "vetenskap"
    site_subpage: "vetenskap/ovriga-kallor"
    category: ["Hjärt-kärlrisk", "Longitudinella studier"]
    tags: ["Framingham", "Prevention", "Risk factors", "public health"]
    summary: >
      Detta är den första vetenskapliga presentationen av Framinghamstudien. Författarna beskriver upplägget för en långsiktig populationsstudie där invånare i Framingham, Massachusetts, rekryterades för regelbundna medicinska undersökningar. Syftet var att identifiera faktorer som bidrar till hjärt–kärlsjukdom. Artikeln introducerar ett nytt medicinskt paradigm: att sjukdom kan förstås genom att följa risk över tid, inte bara behandla akuta händelser.
    insights_for_site: >
      Framingham var startpunkten för begreppet medicinska riskfaktorer.
      	•	Studien visade att hypertoni, kolesterol och rökning är starka prediktorer för hjärt–kärlsjukdom.
      	•	Den representerar övergången från “reparativ” medicin till prediktiv och preventiv medicin.
      	•	Den är fundamentet för allt vi i dag kallar metabol risk, kardiovaskulär prevention och longitudinell mätning av hälsa.
