  - id: "hotamisligil2006inflammation-and-met"
    title: "Inflammation and metabolic disorder (2006)"
    authors: "Gökhan S. Hotamisligil"
    year: 2006
    journal: "Nature"
    doi: "10.1038/nature05485"
    url: "https://doi.org/10.1038/nature05485"
    site_section: "diagnoser"
    site_subpage: "diagnoser/diabetes-typ-2"
    category: ["Inflammation", "Kardiovaskulär risk", "Typ 2 diabetes", "Övervikt / Fetma"]
    tags: ["ER stress (endoplasmatic reticulum stress)", "adipokines", "adipose tissue", "chronic inflammation", "cytokines", "insulin resistance", "low grade inflammation", "macrophage infiltration", "metaflammation", "oxidatice stress"]
    summary: >
      This landmark review outlines how chronic, low-grade inflammation is a central mechanism
      linking obesity, insulin resistance, type 2 diabetes, and cardiovascular disease.
      Hotamisligil describes how adipose tissue becomes immunologically active, how cytokines
      disrupt insulin signaling, and how metabolic stressors—including lipotoxicity,
      oxidative stress, and ER stress—drive systemic metabolic dysfunction.
      insights: |
      This article established immunometabolism as a field. It shows that metabolic disease
      is not only a disorder of energy balance but also a dysfunction of immune regulation.
      The concept of 'metaflammation' introduced here forms part of the theoretical foundation
      of Metabolism X: chronic metabolic stress leads to persistent inflammatory signaling,
      accelerating biological aging and organ network desynchronization.
    insights_for_site: >
      Insights – Hotamisligil (2006)


      • Artikeln etablerar för första gången att inflammation inte är en följdsjukdom av fetma — utan en aktiv drivare av hela det metabola syndromet.
      • Introducerar synsättet att metabolismen och immunsystemet är två integrerade nätverk, där störningar i det ena omedelbart påverkar det andra.
      • Visar att fettväv inte är passiv energilagring utan ett endokrint och immunologiskt organ som aktivt producerar inflammatoriska signalmolekyler.
      • Förskjuter fokus från enskilda organdefekter (t.ex. lever, pankreas) till systemisk dysreglering som förklarar varför olika metabola sjukdomar nästan alltid uppträder tillsammans.
      • Understryker att låggradig inflammation är en tyst, kronisk stressreaktion som accelererar mycket av det vi uppfattar som biologiskt åldrande.
      • Etablerar den moderna idén att behandla metabolism kräver att man tystar inflammationen, inte bara sänker blodsocker eller blodfetter.
