<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metabolism X</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: url('ljus_vagg_3.jpeg') center/cover no-repeat;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 50% 18%, rgba(255,255,255,0.18), transparent 34%),
    linear-gradient(to bottom, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  pointer-events: none;
}

.card {
  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.42),
    rgba(255,255,255,0.22)
  );
  padding: 40px;
  max-width: 560px;
  text-align: center;
  z-index: 1;
  border: 1px solid rgba(255,255,255,0.42);
  box-shadow:
    0 24px 60px rgba(0,0,0,0.11),
    inset 0 1px 0 rgba(255,255,255,0.42),
    inset 0 -10px 24px rgba(255,255,255,0.08);
  backdrop-filter: blur(12px) saturate(1.05);
  -webkit-backdrop-filter: blur(12px) saturate(1.05);
}

.card h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  margin-bottom: 20px;
  letter-spacing: 0.05em;
}

.card p {
  font-size: 16px;
  line-height: 1.7;
  margin-bottom: 22px;
  color: #333;
}

.cta-text {
  text-align: center;
  margin: 80px 0;
}

.cta-text a {
  text-decoration: none;
  color: #1c1c1c;
  font-size: 14px;
  letter-spacing: 0.12em;
  border-bottom: 1px solid rgba(0,0,0,0.2);
  padding-bottom: 2px;
  transition: all 0.2s ease;
}

.cta-text a:hover {
  opacity: 0.7;
  border-bottom: 1px solid rgba(0,0,0,0.4);
}

.meta-link {
  position: fixed;
  right: 56px;
  bottom: 22vh;
  text-align: right;
  z-index: 1;
}

.meta-link a {
  text-decoration: none;
  color: #1c1c1c;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

.meta-title {
  font-size: 12px;
  letter-spacing: 0.18em;
  font-weight: 500;
}

.meta-read {
  font-size: 12px;
  margin-top: 4px;
  opacity: 0.7;
  letter-spacing: 0.08em;
}

.meta-link a:hover .meta-read {
  opacity: 1;
}

@media (max-width: 768px) {
  body {
    background-position: center;
    background-size: cover;
    padding: 20px;
  }

  .card {
    max-width: 100%;
  }

  .meta-link {
    right: 28px;
    bottom: 16vh;
  }

  .meta-link .meta-title,
  .meta-link .meta-read {
    text-shadow: 0 1px 0 rgba(255,255,255,0.18);
  }

  .card {
    max-width: 100%;
  }

  .meta-link {
    right: 28px;
  }
}

</style>
</head>

<body>
  <div class="card">
    <h1>vitalitet — genom hela livet</h1>

    <p>
    Ett initiativ för att förstå och följa riskfaktorer för åldersrelaterad sjukdom tidigare.
    </p>

    <p>
    Härifrån finns två vägar: att läsa vidare i det medicinska perspektivet, eller att delta i piloten.
    </p>

    <div class="cta-text">
      <a href="pilot/index.html">Vidare till piloten</a>
    </div>
  </div>

  <div class="meta-link">
    <a href="risk/index.html">
      <span class="meta-title">METABOLISM X</span>
      <span class="meta-read">Läs mer →</span>
    </a>
  </div>

</body>
</html>
