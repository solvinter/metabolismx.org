  - id: "ref_drug_glp1_mechanisms"
    type: "paper"
    title: "Mechanisms of Action and Therapeutic Application of Glucagon-like Peptide-1"
    short: "GLP-1 påverkar glukos, magsäckstömning och centrala aptitsignaler samtidigt."
    summary: "Ger mekanistisk bakgrund till varför GLP-1-analoger får effekter som sträcker sig längre än glukossänkning."
    authors: "Drucker DJ"
    journal: "Cell Metabolism"
    year: "2018"
    doi: "10.1016/j.cmet.2018.03.001"
    category: "Läkemedel"
    abstract: "GLP-1-analoger påverkar flera biologiska nivåer samtidigt. De stimulerar glukosberoende insulinsekretion, dämpar glukagon, fördröjer magsäckstömning och verkar centralt på aptitreglering. Det gör att läkemedelsklassen inte bara sänker blodsocker, utan också förändrar hunger, energiintag och i vissa fall kroppsvikt. Mekanistiskt är detta ett tydligt exempel på hur ett läkemedel som utvecklats för en diagnos i praktiken verkar på ett bredare kardiometabolt system."

  - id: "ref_drug_glp1_weight"
    type: "paper"
    title: "GLP-1 and weight"
    short: "GLP-1-behandling har visat tydlig viktnedgång i stora studier."
    summary: "GLP-1-analoger påverkar aptitreglering och vikt i en grad som gjort dem kliniskt relevanta långt utanför diabetes."
    authors: "Wilding JPH et al."
    journal: "New England Journal of Medicine"
    year: "2021"
    doi: "10.1056/NEJMoa2032183"
    category: "Läkemedel"
    abstract: "Stora studier av GLP-1-behandling vid övervikt och fetma har visat kliniskt betydande viktnedgång tillsammans med förbättringar i flera metabola markörer. Effekten verkar inte bara bero på viljestyrd livsstilsförändring, utan på förändrad aptitreglering, mättnad och långsammare magsäckstömning. Resultaten har varit viktiga därför att de flyttat läkemedelsklassen från en snäv diabetesindiktion till en bredare förståelse av vikt som biologiskt reglerbar snarare än enbart beteendestyrd."

